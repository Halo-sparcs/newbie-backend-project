<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <a href="../index.html" class="logo">Newbie-Project</a>
  </header>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-switch">
        <button id="login-btn" class="active">Login</button>
        <button id="signup-btn">Signup</button>
      </div>
      <div class="auth-form">
        <!-- Login Form -->
        <form id="login-form">
          <h2>Login</h2>
          <div class="form-group">
            <label for="login-id">ID</label>
            <input type="text" id="login-id" name="login-id" placeholder="Enter your ID" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="login-password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn">Login</button>
        </form>
        <!-- Signup Form -->
        <form id="signup-form" style="display: none;">
          <h2>Signup</h2>
          <div class="form-group">
            <label for="signup-id">ID</label>
            <input type="text" id="signup-id" name="signup-id" placeholder="Choose an ID" required>
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="signup-password" placeholder="Create a password" required>
          </div>
          <div class="form-group">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" name="signup-username" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="signup-contact">Contact</label>
            <input type="text" id="signup-contact" name="signup-contact" placeholder="Phone number" required>
          </div>
          <button type="submit" class="btn">Signup</button>
        </form>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
