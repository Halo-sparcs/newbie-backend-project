<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>My Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="../index.html" class="logo">Newbie-Project</a>
    <h1>My Page</h1>
  </header>
  <div class="container">
    <form id="mypage-form">
      <div class="form-group">
        <label for="user_id">User ID</label>
        <input type="text" id="user_id" name="user_id" readonly>
      </div>
      <div class="form-group">
        <label for="user_pwd">Password</label>
        <input type="password" id="user_pwd" name="user_pwd">
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username">
      </div>
      <div class="form-group">
        <label for="contact">Contact</label>
        <input type="text" id="contact" name="contact">
      </div>
      <div class="form-group">
        <label for="score">Score</label>
        <input type="number" id="score" name="score" readonly>
      </div>
      <button type="submit" class="btn">수정하기</button>
    </form>
    <!-- 로그 페이지로 이동하는 버튼 추가 -->
    <a href="../log/index.html" class="btn" style="margin-top: 1rem; display: block; text-align: center;">로그 보기</a>
    <a href="../createPost/index.html" class="btn" style="margin-top: 1rem; display: block; text-align: center;">물건 등록하기</a>
  </div>
  <script src="script.js"></script>
</body>
</html>
