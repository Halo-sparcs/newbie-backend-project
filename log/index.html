<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Log Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a href="../index.html" class="logo">newbie-project</a>
    <h1>Log Page</h1>
  </header>
  <div class="container">
    <div class="logs-wrapper">
      <!-- 왼쪽: 빌린 물건 로그 -->
      <div class="logs-column" id="borrowed-logs">
        <h2>빌린 물건</h2>
        <!-- 빌린 로그 항목들이 여기 추가됩니다. -->
      </div>
      <!-- 중앙: 본인에게 요청된 물건 로그 -->
      <div class="logs-column" id="requested-logs">
        <h2>요청된 물건</h2>
        <!-- 요청된 로그 항목들이 여기 추가됩니다. -->
      </div>
      <!-- 오른쪽: 반납 신청된 물건 로그 -->
      <div class="logs-column" id="return-requested-logs">
        <h2>반납 신청된 물건</h2>
        <!-- 반납 신청된 로그 항목들이 여기 추가됩니다. -->
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
